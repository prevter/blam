name: Draft Release

on:
  workflow_dispatch:

jobs:
  draft:
    name: Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Project Version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "
          import re
          with open('CMakeLists.txt', 'r') as f:
              match = re.search(r'project\s*\([^)]*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)', f.read(), re.DOTALL | re.IGNORECASE)
              print(match.group(1) if match else '0.0.0')
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Nightly Builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dev
          gh release download nightly --dir dev --clobber

      - name: Rename Artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-assets
          
          for file in dev/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            new_name=$(echo "$filename" | sed -E "s/^blam-[a-f0-9]+-/blam-v${VERSION}-/")
            mv "$file" "release-assets/$new_name"
          done

      - name: Create Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          gh release create "$TAG" \
            --title "blam ${TAG}" \
            --notes $"TODO: Change this description" \
            --draft \
            release-assets/*