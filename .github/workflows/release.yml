name: Release

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: "linux-amd64"
            binary_path: "build/wtf"
            name: "Linux"
          - os: macos-latest
            artifact_name: "macos-universal"
            binary_path: "build/wtf"
            name: "macOS"
          - os: windows-latest
            artifact_name: "windows-amd64"
            binary_path: "build/wtf.exe"
            name: "Windows"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Clang
        if: ${{ matrix.name != 'macOS' }}
        uses: egor-tensin/setup-clang@v2
        with:
          version: 22

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release --parallel

      - name: Extract Project Version
        id: cmake_version
        shell: bash
        run: |
          VERSION=$(python3 -c "
          import re
          with open('CMakeLists.txt', 'r') as f:
              match = re.search(r'project\s*\([^)]*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)', f.read(), re.DOTALL | re.IGNORECASE)
              print(match.group(1) if match else '0.0.0')
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Versioned Archive
        shell: bash
        run: |
          VERSION="${{ steps.cmake_version.outputs.version }}"
          ARCHIVE_NAME="wtf-v${VERSION}-${{ matrix.artifact_name }}"
          
          mkdir -p dist
          cd build
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../dist/${ARCHIVE_NAME}.zip" wtf.exe
          else
            tar -czvf "../dist/${ARCHIVE_NAME}.tar.gz" wtf
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archives-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

      - name: Run tests
        run: ctest --test-dir build

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract CMake Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python3 -c "
          import re
          with open('CMakeLists.txt', 'r') as f:
              match = re.search(r'project\s*\([^)]*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)', f.read(), re.DOTALL | re.IGNORECASE)
              if match:
                  print(match.group(1))
              else:
                  raise ValueError('VERSION not found in CMakeLists.txt project() command')
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: archives-*
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}